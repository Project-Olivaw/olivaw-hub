name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: Project-Olivaw/olivaw-slam, path: ../olivaw-slam }
      - uses: actions/checkout@v4
        with: { repository: Project-Olivaw/olivaw-lidar, path: ../olivaw-lidar }
      - uses: actions/checkout@v4
        with: { repository: Project-Olivaw/olivaw-fw, path: ../olivaw-fw }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
