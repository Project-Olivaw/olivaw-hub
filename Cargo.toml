[package]
name = "olivaw-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Telemetry hub for Olivaw vehicles: embedded MQTT broker, scan ingest, live SLAM, HTTP + WebSocket API, rerun sink, record/replay and a simulator"
repository = "https://github.com/Project-Olivaw/olivaw-hub"
keywords = ["robotics", "mqtt", "slam", "telemetry", "lidar"]
categories = ["science::robotics", "network-programming"]

[features]
default = ["broker"]
## Run rumqttd inside the hub (no external broker needed).
broker = ["dep:rumqttd"]
## `--rerun`: stream scans, trajectory and map to the rerun viewer.
rerun = ["dep:rerun", "olivaw-slam/viz"]

[dependencies]
olivaw-proto = { path = "../olivaw-fw/olivaw-proto", features = ["std"] }
olivaw-slam = { path = "../olivaw-slam", features = ["serialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws", "json"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls"] }
rumqttd = { version = "0.20", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
png = "0.17"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
toml = "0.9"
rerun = { version = "0.34.1", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"   # f64 → f32 for the dashboard is deliberate everywhere
